[project]
name = "lsn23-6-library"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "django-redis (>=7.0.0,<8.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
develop = [
    "ipython (>=9.15.0,<10.0.0)"
]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[black]
line-length = 119
exclude = '\.git'

[isort]
line_length = 119
force_single_line = true
