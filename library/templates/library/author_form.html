{% extends 'library/base.html' %}

{% block title %}Добавить/Редактировать автора{% endblock %}

{% block content %}
{% include 'library/header.html' %}
<h2>{{ view.title }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'library:authors_list' %}" class="btn btn-secondary">Отменить</a>
</form>
{% endblock %}
